# ============================================
# mangoWM Configuration
# More options: https://github.com/DreamMaoMao/mango/wiki/
# ============================================

# --------------------------------------------
# Window Effects & Visuals
# --------------------------------------------
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=1
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2

shadows=1
layer_shadows=0
shadow_only_floating=1
shadows_size=10
shadows_blur=15
shadows_position_x=0
shadows_position_y=0
shadowscolor=0x000000ff

border_radius=6
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# --------------------------------------------
# Global Animation Configuration
# --------------------------------------------
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=400
animation_duration_open=300
animation_duration_tag=350
animation_duration_close=300
animation_duration_focus=0
animation_curve_open=0.25, 1, 0.5, 1
animation_curve_move=0.25, 1, 0.5, 1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.7, 0, 0.84, 0
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# --------------------------------------------
# Scroller Layout (Primary)
# --------------------------------------------
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=1
scroller_prefer_center=1
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=1.0,0.8,0.5

# --------------------------------------------
# Overview & Hotarea
# --------------------------------------------
hotarea_size=10
enable_hotarea=0
ov_tab_mode=0
overviewgappi=5
overviewgappo=30

# --------------------------------------------
# System & Hardware
# --------------------------------------------
xwayland_persistence=1          # Keep XWayland alive for faster X11 app startup
syncobj_enable=1                # Enable drm_syncobj timeline (reduces gaming stutter)
allow_lock_transparent=0        # Lock screen transparency (0 = opaque)
allow_shortcuts_inhibit=1       # Apps can inhibit global shortcuts (e.g., games)

# --------------------------------------------
# Focus & Input Behavior
# --------------------------------------------
focus_on_activate=1
sloppyfocus=1                   # Focus follows mouse
warpcursor=0                    # Warp cursor to focused window
cursor_hide_timeout=3000        # Hide cursor after 3 seconds of inactivity (0 = never)
drag_tile_to_tile=1             # Drag tiled windows to swap positions
drag_corner=4                   # Auto‑detect drag‑to‑tile corner (0 = none, 1‑3 = fixed, 4 = auto)
drag_warp_cursor=1              # Warp cursor when dragging to tile
axis_bind_apply_timeout=100     # Timeout (ms) for axis binding detection
axis_scroll_factor=1.2          # Slightly faster trackpad scrolling

# Window drag refresh intervals (lower = smoother but heavier)
drag_tile_refresh_interval=8.0
drag_floating_refresh_interval=8.0

# --------------------------------------------
# Multi‑Monitor & Tag Behavior
# --------------------------------------------
focus_cross_monitor=1           # Directional focus crosses monitor boundaries
exchange_cross_monitor=0        # Exchange clients across monitors (keep 0 for stability)
focus_cross_tag=0               # Directional focus does not cross tags
view_current_to_back=1          # Toggle current tag returns to previous tag
scratchpad_cross_monitor=0      # Scratchpads stay per‑monitor
single_scratchpad=1             # Only one scratchpad visible at a time

# --------------------------------------------
# Floating Window Snap
# --------------------------------------------
enable_floating_snap=1          # Snap floating windows to edges/other windows
snap_distance=30                # Pixels to trigger snap

# --------------------------------------------
# Miscellaneous Behavior
# --------------------------------------------
no_border_when_single=1         # Remove borders when only one window (prevents windowed mode feel)
idleinhibit_ignore_visible=0
cursor_size=24

# --------------------------------------------
# Device Configuration
# --------------------------------------------
# Keyboard
repeat_rate=45
repeat_delay=250
numlockon=1
xkb_rules_layout=us,us
xkb_rules_variant=,dvorak
# Removed caps:escape to restore normal Caps Lock behavior
xkb_rules_options=grp:lalt_lshift_toggle

# Trackpad (laptop only)
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
disable_while_typing=1
left_handed=0
middle_button_emulation=0
scroll_method=1
click_method=1
swipe_min_threshold=10

# Mouse
mouse_natural_scrolling=0
mouse_accel_profile=1
mouse_accel_speed=-0.15

# --------------------------------------------
# Appearance – Gaps & Colors
# --------------------------------------------
gappih=10
gappiv=5
gappoh=10
gappov=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=4
rootcolor=0x201b14ff
bordercolor=0x444444ff
focuscolor=0xc9b890ff
maximizescreencolor=0x89aa61ff
urgentcolor=0xad401fff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

# --------------------------------------------
# Tag Rules – Scroller Everywhere
# --------------------------------------------
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:scroller
tagrule=id:4,layout_name:scroller
tagrule=id:5,layout_name:scroller
tagrule=id:6,layout_name:scroller
tagrule=id:7,layout_name:scroller
tagrule=id:8,layout_name:scroller
tagrule=id:9,layout_name:scroller

# --------------------------------------------
# Window Rules – Floating, Swallowing, Visuals
# --------------------------------------------
# Force tiled state for all windows to prevent windowed mode
windowrule=force_tiled_state:1,appid:.*

# Floating dialogs & utilities (scaled for 1920x1080)
windowrule=isfloating:1,width:900,height:700,appid:pavucontrol
windowrule=isfloating:1,width:800,height:600,appid:blueman-manager
windowrule=isfloating:1,width:550,height:500,appid:gnome-calculator
windowrule=isfloating:1,width:900,height:650,appid:nm-connection-editor
windowrule=isfloating:1,width:800,height:600,appid:qt5ct
windowrule=isfloating:1,width:650,height:550,appid:org.kde.kcalc
windowrule=isfloating:1,width:1000,height:700,appid:org.gnome.Nautilus
windowrule=isfloating:1,width:1000,height:700,appid:thunar

# Terminal swallowing
windowrule=isterm:1,appid:ghostty
windowrule=isterm:1,appid:alacritty
windowrule=isterm:1,appid:foot
windowrule=noswallow:1,appid:thunar
windowrule=noswallow:1,appid:org.gnome.Nautilus

# Scratchpad (named)
windowrule=isnamedscratchpad:1,single_scratchpad:1,appid:scratchterm

# Gaming & performance
windowrule=force_tearing:1,appid:osu!
windowrule=force_tearing:1,appid:steam_app_*
windowrule=isnoanimation:1,appid:steam_app_*
windowrule=isnoanimation:1,appid:osu!
windowrule=isfakefullscreen:1,appid:steam_app_*

# Open silently (no focus steal)
windowrule=isopensilent:1,appid:.*reminder.*
windowrule=isopensilent:1,title:.*notification.*

# Global keybinding for Wayland apps
windowrule=globalkeybinding:CTRL-SHIFT-R,appid:com.obsproject.Studio

# --------------------------------------------
# Key Bindings
# --------------------------------------------
# Reload config
bind=SUPER,r,reload_config

# Terminal & apps
bind=CTRL+ALT,T,spawn,ghostty
bind=SUPER,E,spawn,ghostty -e yazi

# Exit client
bind=SUPER,q,killclient,

# Window focus navigation
bind=SUPER,Tab,focusstack,next
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# Swap windows (keeps windows tiled)
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

# Window states
bind=SUPER,g,toggleglobal,
bind=ALT,Tab,focusstack,next,
bind=SUPER,t,togglefloating,
bind=SUPER,W,togglemaximizescreen,
bind=SUPER,f,togglefullscreen,
bind=SUPER+SHIFT,F,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverview,
bind=SUPER+SHIFT,I,restore_minimized

# Scratchpad
bind=SUPER,z,toggle_scratchpad
bind=SUPER+SHIFT,Z,toggle_scratchpad,scratchterm

# Scroller layout controls
bind=SUPER+SHIFT,E,set_proportion,1.0
bind=SUPER,x,switch_proportion_preset,

# Tag navigation
bind=SUPER+ALT,Left,viewtoleft,0
bind=SUPER+CTRL,Left,viewtoleft_have_client,0
bind=SUPER+ALT,Right,viewtoright,0
bind=SUPER+CTRL,Right,viewtoright_have_client,0
bind=SHIFT+SUPER,Left,tagtoleft,0
bind=SHIFT+SUPER,Right,tagtoright,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# Move client to tag
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# Monitor switching
bind=SUPER+ALT+SHIFT,Left,focusmon,left
bind=SUPER+ALT+SHIFT,Right,focusmon,right
bind=SUPER+ALT+CTRL,Left,tagmon,left
bind=SUPER+ALT+CTRL,Right,tagmon,right

# Gaps
bind=SUPER+ALT,X,incgaps,1
bind=SUPER+ALT,Z,incgaps,-1
bind=SUPER+ALT,R,togglegaps

# Move floating windows (only works when window is already floating)
bind=SUPER+CTRL,Left,movewin,-50,+0
bind=SUPER+CTRL,Right,movewin,+50,+0

# Resize floating windows (only works when window is already floating)
bind=SUPER+SHIFT+CTRL,Up,resizewin,+0,-50
bind=SUPER+SHIFT+CTRL,Down,resizewin,+0,+50
bind=SUPER+SHIFT+CTRL,Left,resizewin,-50,+0
bind=SUPER+SHIFT+CTRL,Right,resizewin,+50,+0

# Launcher & system controls (noctalia-shell)
bind=SUPER,space,spawn,qs -c noctalia-shell ipc call launcher toggle
bind=SUPER,s,spawn,qs -c noctalia-shell ipc call controlCenter toggle
bind=SUPER,comma,spawn,qs -c noctalia-shell ipc call settings toggle

# Media keys
bind=NONE,XF86AudioRaiseVolume,spawn,qs -c noctalia-shell ipc call volume increase
bind=NONE,XF86AudioLowerVolume,spawn,qs -c noctalia-shell ipc call volume decrease
bind=NONE,XF86AudioMute,spawn,qs -c noctalia-shell ipc call volume muteOutput
bind=NONE,XF86MonBrightnessUp,spawn,qs -c noctalia-shell ipc call brightness increase
bind=NONE,XF86MonBrightnessDown,spawn,qs -c noctalia-shell ipc call brightness decrease

# --------------------------------------------
# Mouse Button Bindings
# --------------------------------------------
# Window manipulation with mouse
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER+CTRL,btn_right,killclient,

# Overview mode mouse controls (works only in overview)
mousebind=NONE,btn_left,toggleoverview,-1
mousebind=NONE,btn_right,killclient,0

# --------------------------------------------
# Axis Bindings (scroll wheel actions)
# --------------------------------------------
# Mouse wheel: cycle through clients (when holding SUPER)
axisbind=SUPER,UP,focusstack,prev
axisbind=SUPER,DOWN,focusstack,next

# Mouse wheel: switch tags (when holding SUPER+ALT)
axisbind=SUPER+ALT,UP,viewtoleft,0
axisbind=SUPER+ALT,DOWN,viewtoright,0

# Mouse wheel: adjust gaps (when holding SUPER+ALT)
axisbind=SUPER+CTRL,UP,incgaps,1
axisbind=SUPER+CTRL,DOWN,incgaps,-1

# --------------------------------------------
# Gesture Bindings (touchpad swipes)
# --------------------------------------------
# 3‑finger gestures: window focus
gesturebind=none,left,3,focusdir,right
gesturebind=none,right,3,focusdir,left
gesturebind=none,up,3,focusdir,down
gesturebind=none,down,3,focusdir,up

# 4‑finger gestures: workspace & overview
gesturebind=none,left,4,viewtoleft_have_client
gesturebind=none,right,4,viewtoright_have_client
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview

# --------------------------------------------
# Switch Bindings (laptop lid events)
# --------------------------------------------
# Requires disabling systemd lid handling (see docs)
switchbind=fold,spawn,swaylock -f -c 000000
switchbind=unfold,spawn,loginctl unlock-session

# --------------------------------------------
# Startup
# --------------------------------------------
exec-once=sleep 2 && qs -c noctalia-shell
